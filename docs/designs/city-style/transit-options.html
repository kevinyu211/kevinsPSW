<!doctype html><html><head><meta charset="utf-8"><title>Three future transit looks</title></head><body><style>.pl h3{margin:20px 0 4px;font:700 15px/1.3 var(--font-sans);color:var(--foreground)}.pl h3:first-child{margin-top:0}.pl p{margin:0 0 10px;font:400 13px/1.5 var(--font-sans);color:var(--foreground)}</style><div class="pl">
<h3>A · Glide line</h3><p>The train floats above one slim white beam with a strip of light. No rails, sleepers or wires.</p><svg viewBox="0 0 720 190" role="img" style="width:100%;height:auto;display:block;font-family:var(--font-sans)"><rect width="720" height="190" rx="12" fill="#CFE6F2"/><rect y="150" width="720" height="40" fill="#D6E8BE"/><rect y="150" width="720" height="3" fill="#B9D49A"/><path d="M87 96L84 150h12L93 96z" fill="#fff" stroke="#111" stroke-width="1.5"/><path d="M267 96L264 150h12L273 96z" fill="#fff" stroke="#111" stroke-width="1.5"/><path d="M447 96L444 150h12L453 96z" fill="#fff" stroke="#111" stroke-width="1.5"/><path d="M627 96L624 150h12L633 96z" fill="#fff" stroke="#111" stroke-width="1.5"/><rect x="0" y="88" width="720" height="8" rx="4" fill="#fff" stroke="#111" stroke-width="1.5"/><rect x="0" y="84" width="720" height="3" fill="#39C6E0"/><g><rect x="250" y="50" width="210" height="30" rx="15" fill="#fff" stroke="#111" stroke-width="2"/><rect x="272" y="57" width="166" height="11" rx="5.5" fill="#1F3A4D"/><path d="M321.4 57v11M388.6 57v11" stroke="#fff" stroke-width="2"/><rect x="260" y="72" width="190" height="3" rx="1.5" fill="#D5281E"/></g></svg>
<h3>B · Glass tube</h3><p>Capsules run inside a clear tube round the island.</p><svg viewBox="0 0 720 190" role="img" style="width:100%;height:auto;display:block;font-family:var(--font-sans)"><rect width="720" height="190" rx="12" fill="#CFE6F2"/><rect y="150" width="720" height="40" fill="#D6E8BE"/><rect y="150" width="720" height="3" fill="#B9D49A"/><path d="M117 104L114 150h12L123 104z" fill="#fff" stroke="#111" stroke-width="1.5"/><path d="M357 104L354 150h12L363 104z" fill="#fff" stroke="#111" stroke-width="1.5"/><path d="M597 104L594 150h12L603 104z" fill="#fff" stroke="#111" stroke-width="1.5"/><rect x="-10" y="46" width="740" height="58" rx="29" fill="#fff" fill-opacity=".35" stroke="#111" stroke-width="2"/><ellipse cx="120" cy="75" rx="5" ry="29" fill="none" stroke="#111" stroke-width="1.5"/><ellipse cx="240" cy="75" rx="5" ry="29" fill="none" stroke="#111" stroke-width="1.5"/><ellipse cx="360" cy="75" rx="5" ry="29" fill="none" stroke="#111" stroke-width="1.5"/><ellipse cx="480" cy="75" rx="5" ry="29" fill="none" stroke="#111" stroke-width="1.5"/><ellipse cx="600" cy="75" rx="5" ry="29" fill="none" stroke="#111" stroke-width="1.5"/><g><rect x="250" y="60" width="210" height="30" rx="15" fill="#fff" stroke="#111" stroke-width="2"/><rect x="272" y="67" width="166" height="11" rx="5.5" fill="#1F3A4D"/><path d="M321.4 67v11M388.6 67v11" stroke="#fff" stroke-width="2"/><rect x="260" y="82" width="190" height="3" rx="1.5" fill="#D5281E"/></g></svg>
<h3>C · No track at all</h3><p>The train flies along an invisible lane, marked only by dots of light and a few floating rings.</p><svg viewBox="0 0 720 190" role="img" style="width:100%;height:auto;display:block;font-family:var(--font-sans)"><rect width="720" height="190" rx="12" fill="#CFE6F2"/><rect y="150" width="720" height="40" fill="#D6E8BE"/><rect y="150" width="720" height="3" fill="#B9D49A"/><path d="M0 108H720" stroke="#39C6E0" stroke-width="3" stroke-dasharray="3 12" stroke-linecap="round"/><ellipse cx="130" cy="76" rx="9" ry="38" fill="none" stroke="#111" stroke-width="2"/><ellipse cx="130" cy="76" rx="9" ry="38" fill="none" stroke="#39C6E0" stroke-width="5" stroke-opacity=".35"/><ellipse cx="590" cy="76" rx="9" ry="38" fill="none" stroke="#111" stroke-width="2"/><ellipse cx="590" cy="76" rx="9" ry="38" fill="none" stroke="#39C6E0" stroke-width="5" stroke-opacity=".35"/><g><rect x="250" y="60" width="210" height="30" rx="15" fill="#fff" stroke="#111" stroke-width="2"/><rect x="272" y="67" width="166" height="11" rx="5.5" fill="#1F3A4D"/><path d="M321.4 67v11M388.6 67v11" stroke="#fff" stroke-width="2"/><rect x="260" y="82" width="190" height="3" rx="1.5" fill="#D5281E"/></g><ellipse cx="355" cy="150" rx="90" ry="5" fill="#111" fill-opacity=".15"/></svg>
