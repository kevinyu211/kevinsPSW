<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kevin Yu · Ride the line</title>
<meta name="description" content="Kevin Yu builds AI products and ships them end to end. Ride one train through his city: software, books and apps, film, games and healthcare AI.">
<meta name="theme-color" content="#F3F3EF">
<link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#panel">Skip to the platform</a>

<header class="bar">
  <a class="brand" href="#/station/origin" data-go="0" aria-label="Kevin Yu, back to the first station">
    <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="9" width="26" height="14" rx="7"/><circle cx="10" cy="16" r="3"/><circle cx="22" cy="16" r="3"/></svg>
    <span>Kevin Yu</span>
  </a>
  <p class="bar-now" data-now aria-live="polite"></p>
  <button class="btn btn-ink btn-sm" type="button" data-pass-open>
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2.5"/><path d="M3 10h18"/></svg>
    Pass
  </button>
</header>

<nav class="hud" aria-label="Line diagram: ride to a station">
  <div class="hud-track" data-hud>
    <span class="hud-train" data-hud-train aria-hidden="true"></span>
  </div>
</nav>

<main class="city" id="main">
  <div class="stage" data-stage>
    <div class="stage-ride" role="group" aria-label="Ride controls">
      <button class="ride-btn" type="button" data-prev aria-label="Previous station">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <p class="ride-label" data-ride-label></p>
      <button class="ride-btn ride-next" type="button" data-next>
        <span data-next-label>Ride</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>
  </div>

  <section class="panel" id="panel" data-panel tabindex="-1" aria-live="polite" aria-labelledby="panel-title">
    <div class="panel-in" data-panel-in></div>
  </section>
</main>

<!-- Departure board: one project in full -->
<aside class="board" data-board role="dialog" aria-modal="true" aria-labelledby="board-title" hidden>
  <div class="board-scrim" data-close></div>
  <div class="board-panel" data-board-panel>
    <header class="board-head">
      <div class="board-bullets" data-bullets></div>
      <h2 class="board-title" id="board-title" data-title></h2>
      <p class="board-status" data-status></p>
      <button class="board-close" type="button" data-close aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>
    <div class="board-body">
      <div class="gallery">
        <div class="stage-media" data-media></div>
        <div class="thumbs" data-thumbs role="group" aria-label="Media"></div>
      </div>
      <p class="board-role" data-role></p>
      <div class="board-text" data-body></div>
      <ul class="facts" data-facts></ul>
      <div class="board-links" data-links></div>
    </div>
  </div>
</aside>

<!-- The metro pass: Kevin's card in this world -->
<div class="pass-dlg" data-pass role="dialog" aria-modal="true" aria-labelledby="pass-title" hidden>
  <div class="pass-scrim" data-pass-close></div>
  <div class="pass-wrap">
    <h2 class="sr" id="pass-title">Kevin Yu's metro pass</h2>
    <div class="pass" data-pass-card>
      <div class="pass-inner" data-pass-inner>
        <div class="pass-face pass-front">
          <div class="pass-top">
            <span class="pass-chip" aria-hidden="true"><i></i><i></i><i></i><b>K</b></span>
            <span class="pass-valid">All lines · Non-stop</span>
          </div>
          <div class="pass-name">
            <p class="pass-n">Kevin Yu</p>
            <p class="pass-r">Co-founder &amp; CTO, Hirvo · Builder</p>
          </div>
          <div class="pass-stripes" aria-hidden="true"><i class="b-software"></i><i class="b-books"></i><i class="b-film"></i><i class="b-games"></i><i class="b-health"></i></div>
          <span class="pass-stamp" data-pass-stamp aria-hidden="true">Added</span>
        </div>
        <div class="pass-face pass-back">
          <div class="pass-back-grid">
            <dl class="pass-info">
              <div><dt>Phone</dt><dd><a href="tel:+17654210237">+1 (765) 421-0237</a></dd></div>
              <div><dt>LinkedIn</dt><dd><a href="https://www.linkedin.com/in/kevin-yu-5b7103327" target="_blank" rel="noopener">kevin-yu-5b7103327</a></dd></div>
              <div><dt>Website</dt><dd><a href="https://kevinpeiyuanyu.com" target="_blank" rel="noopener">kevinpeiyuanyu.com</a></dd></div>
            </dl>
            <img class="pass-qr" src="../../assets/img/wechat-qr.png" alt="WeChat QR code for Kevin Yu" width="120" height="120">
          </div>
        </div>
      </div>
    </div>
    <div class="pass-actions">
      <button class="btn btn-line" type="button" data-pass-flip aria-pressed="false">Flip card</button>
      <a class="btn btn-ink" href="../shared/kevin-yu.vcf" download="kevin-yu.vcf" data-pass-add>Add to contacts</a>
      <button class="btn btn-line" type="button" data-pass-copy>Copy link</button>
      <button class="btn btn-line" type="button" data-pass-close>Close</button>
    </div>
    <p class="pass-note" data-pass-note aria-live="polite"></p>
  </div>
</div>

<noscript><p class="noscript">This ride needs JavaScript. Reach Kevin on <a href="https://www.linkedin.com/in/kevin-yu-5b7103327">LinkedIn</a> or call +1 (765) 421-0237.</p></noscript>

<script src="../shared/content.js"></script>
<script src="../../assets/vendor/gsap.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
